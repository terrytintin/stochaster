<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅子隨機網點工作室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 750: '#2d3748', 850: '#1a202c' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Checkered Background for Transparency */
        .bg-checkered {
            background-color: #e5e5f7;
            opacity: 1;
            background-image:  repeating-linear-gradient(45deg, #c4c4c4 25%, transparent 25%, transparent 75%, #c4c4c4 75%, #c4c4c4), repeating-linear-gradient(45deg, #c4c4c4 25%, #e5e5f7 25%, #e5e5f7 75%, #c4c4c4 75%, #c4c4c4);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
        }
        .dark .bg-checkered {
            background-color: #1e1e1e;
            background-image:  repeating-linear-gradient(45deg, #2d2d2d 25%, transparent 25%, transparent 75%, #2d2d2d 75%, #2d2d2d), repeating-linear-gradient(45deg, #2d2d2d 25%, #1e1e1e 25%, #1e1e1e 75%, #2d2d2d 75%, #2d2d2d);
        }

        /* Prevent text selection while panning */
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* Editable Title Input Reset */
        [contenteditable]:focus { outline: none; border-bottom: 1px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 h-screen flex flex-col font-sans overflow-hidden transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-3 flex justify-between items-center z-10 shrink-0 shadow-sm">
        <div class="flex items-center gap-3">
            <img src="雅子emo.png" alt="Logo" class="w-8 h-8 rounded object-cover" onerror="this.src='https://placehold.co/32x32/3b82f6/ffffff?text=Logo'">
            <h1 class="text-lg font-bold tracking-tight">雅子隨機網點工作室</h1>
        </div>
        <div class="flex items-center gap-3 sm:gap-4">
            <a href="landing.html" class="flex items-center gap-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-medium py-1.5 px-3 rounded-md text-sm transition-colors border border-gray-300 dark:border-gray-600" title="About & Tutorial">
                <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>About / Guide</span>
            </a>
            <a href="https://buymeacoffee.com/terrytin" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 bg-[#FFDD00] hover:bg-[#FFEA4C] text-black font-semibold py-1.5 px-3 rounded-md text-sm transition-colors shadow-sm" title="Support this project">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm-2 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
                <span>Buy me a coffee</span>
            </a>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="Toggle Dark/Light Mode">
                <!-- Moon Icon (shows in light mode) -->
                <svg id="moonIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <!-- Sun Icon (shows in dark mode) -->
                <svg id="sunIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar (Tools & Layers) -->
        <aside class="w-80 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col z-10 shadow-lg shrink-0">
            
            <!-- Toolbar -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 space-y-3">
                <div class="flex gap-2">
                    <button id="btnUpload" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded text-sm transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Open Image
                    </button>
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <button id="btnExport" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded text-sm transition-colors" title="Export as PNG">
                        Export
                    </button>
                </div>
                
                <div class="flex gap-2">
                    <button id="btnHandTool" class="flex-1 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 py-1.5 px-3 rounded text-xs transition-colors flex items-center justify-center gap-1 active-tool">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                        Hand Tool
                    </button>
                    <button id="btnRemoveBg" class="flex-1 bg-gray-100 dark:bg-gray-700 hover:bg-red-100 dark:hover:bg-red-900 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 py-1.5 px-3 rounded text-xs transition-colors flex items-center justify-center gap-1" title="Flood fill remove outer solid background">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Remove BG
                    </button>
                </div>
            </div>

            <!-- Layers Header & Add Button -->
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-850">
                <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Layers</span>
                <button id="btnAddLayer" class="text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>

            <!-- Dynamic Layers Container -->
            <div id="layersContainer" class="flex-1 overflow-y-auto p-3 space-y-3 bg-gray-100 dark:bg-gray-900">
                <!-- Layers injected here via JS -->
            </div>

            <!-- Fixed Background Layer Control -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-850 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <button id="bgVisToggle" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Background</span>
                    </div>
                </div>
                <div class="flex gap-2 items-center">
                    <input type="color" id="bgColorPicker" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    <span class="text-xs text-gray-500 dark:text-gray-400">Color (Transparent if hidden)</span>
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <main id="workspace" class="flex-1 relative bg-checkered overflow-hidden cursor-grab no-select">
            
            <div id="uploadPrompt" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 pointer-events-none transition-opacity duration-300">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-lg font-medium">Upload an image to begin</p>
                <p class="text-sm opacity-75 mt-1">Use the "Open Image" button</p>
            </div>

            <!-- The wrapper moves/scales for pan/zoom without affecting the actual canvas resolution -->
            <div id="canvasWrapper" class="absolute origin-top-left transition-transform duration-75 hidden" style="transform: translate(0px, 0px) scale(1);">
                <canvas id="mainCanvas" class="block"></canvas>
            </div>
            
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="coffeeToast" class="fixed bottom-6 right-6 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-xl rounded-lg p-5 max-w-sm transform transition-all duration-300 translate-y-20 opacity-0 pointer-events-none z-50">
        <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                <img src="雅子emo.png" alt="雅子" class="w-6 h-6 rounded-full object-cover" onerror="this.style.display='none'">
                Export Complete!
            </h3>
            <button onclick="hideToast()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-300 mb-4">Your transparent PNG is ready! If this saved you time today, consider buying 雅子 a coffee ☕</p>
        <a href="https://buymeacoffee.com/terrytin" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-[#FFDD00] hover:bg-[#FFEA4C] text-black font-semibold py-2 px-4 rounded-md transition-colors">
            Buy me a coffee
        </a>
    </div>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let originalImage = null; // HTMLImageElement
        let isProcessing = false;
        
        let layers = [
            { id: Date.now(), name: 'Halftone Dots', filter: 'halftone', blendMode: 'source-over', opacity: 100, size: 6, angle: 45, visible: true, stochasticPreset: 'turing' }
        ];
        
        let bgLayer = {
            visible: true,
            color: '#ffffff'
        };

        // --- Viewport State (Pan/Zoom) ---
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY;
        let isHandToolActive = true;

        // --- DOM Elements ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true }); // optimize for getImageData
        const canvasWrapper = document.getElementById('canvasWrapper');
        const workspace = document.getElementById('workspace');
        const fileInput = document.getElementById('fileInput');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const layersContainer = document.getElementById('layersContainer');
        const btnUpload = document.getElementById('btnUpload');
        const btnExport = document.getElementById('btnExport');
        const btnAddLayer = document.getElementById('btnAddLayer');
        const btnRemoveBg = document.getElementById('btnRemoveBg');
        const btnHandTool = document.getElementById('btnHandTool');
        const bgVisToggle = document.getElementById('bgVisToggle');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const themeToggle = document.getElementById('themeToggle');

        // --- Initialization ---
        function init() {
            renderLayersUI();
            setupEventListeners();
        }

        // --- Event Listeners ---
        function setupEventListeners() {
            // Theme Toggle
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Upload
            btnUpload.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleUpload);

            // Export
            btnExport.addEventListener('click', exportImage);

            // Tools
            btnHandTool.addEventListener('click', () => {
                isHandToolActive = !isHandToolActive;
                btnHandTool.classList.toggle('active-tool', isHandToolActive);
                btnHandTool.classList.toggle('bg-blue-100', isHandToolActive);
                btnHandTool.classList.toggle('dark:bg-blue-900', isHandToolActive);
                workspace.style.cursor = isHandToolActive ? 'grab' : 'default';
            });
            
            btnRemoveBg.addEventListener('click', removeBackground);

            // Layers
            btnAddLayer.addEventListener('click', () => {
                layers.unshift({
                    id: Date.now(),
                    name: `Layer ${layers.length + 1}`,
                    filter: 'halftone',
                    blendMode: 'source-over',
                    opacity: 100,
                    size: 6,
                    angle: 45,
                    visible: true,
                    stochasticPreset: 'turing'
                });
                renderLayersUI();
                processImage();
            });

            // Background Controls
            bgVisToggle.addEventListener('click', () => {
                bgLayer.visible = !bgLayer.visible;
                bgVisToggle.innerHTML = bgLayer.visible ? 
                    '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>' :
                    '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>';
                processImage();
            });
            bgColorPicker.addEventListener('input', (e) => {
                bgLayer.color = e.target.value;
                if(bgLayer.visible) processImage();
            });

            // Pan/Zoom Events
            workspace.addEventListener('wheel', handleZoom, { passive: false });
            workspace.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mousemove', handleMouseMove);
            window.addEventListener('mouseup', handleMouseUp);
            window.addEventListener('resize', centerCanvas); // Recenter on resize
        }

        // --- Drag and Drop Logic ---
        let dragSrcIndex = null;
        
        function handleDragStart(e, index) {
            dragSrcIndex = index;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', index);
            setTimeout(() => e.target.closest('.layer-card').classList.add('opacity-50'), 0);
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault(); // Necessary to allow dropping
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e, targetIndex) {
            if (e.stopPropagation) e.stopPropagation();
            if (dragSrcIndex !== targetIndex && dragSrcIndex !== null) {
                // Reorder array
                const draggedItem = layers.splice(dragSrcIndex, 1)[0];
                layers.splice(targetIndex, 0, draggedItem);
                renderLayersUI();
                processImage();
            }
            return false;
        }

        function handleDragEnd(e) {
            e.target.closest('.layer-card').classList.remove('opacity-50');
        }

        // --- Viewport Pan/Zoom Logic ---
        function updateTransform() {
            canvasWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function centerCanvas() {
            if (!originalImage) return;
            const wsRect = workspace.getBoundingClientRect();
            // Calculate a scale to fit the image comfortably inside the workspace on load
            const fitScaleX = (wsRect.width - 40) / canvas.width;
            const fitScaleY = (wsRect.height - 40) / canvas.height;
            scale = Math.min(fitScaleX, fitScaleY, 1); // Don't scale up past 1x initially
            
            // Center it
            translateX = (wsRect.width - (canvas.width * scale)) / 2;
            translateY = (wsRect.height - (canvas.height * scale)) / 2;
            updateTransform();
        }

        function handleZoom(e) {
            if (!originalImage || !isHandToolActive) return;
            e.preventDefault();
            
            const zoomSensitivity = 0.001;
            const delta = -e.deltaY * zoomSensitivity;
            const newScale = Math.max(0.1, Math.min(scale * Math.exp(delta), 10)); // bounds: 0.1x to 10x

            // Zoom towards mouse position
            const rect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            translateX = mouseX - (mouseX - translateX) * (newScale / scale);
            translateY = mouseY - (mouseY - translateY) * (newScale / scale);
            scale = newScale;
            
            updateTransform();
        }

        function handleMouseDown(e) {
            if (!originalImage || !isHandToolActive || e.button !== 0) return; // Only left click
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            workspace.style.cursor = 'grabbing';
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        }

        function handleMouseUp() {
            if (!isDragging) return;
            isDragging = false;
            workspace.style.cursor = isHandToolActive ? 'grab' : 'default';
        }

        // --- UI Rendering ---
        function renderLayersUI() {
            layersContainer.innerHTML = '';
            layers.forEach((layer, index) => {
                const isGeometric = ['halftone', 'line', 'crosshatch', 'sine'].includes(layer.filter);
                const isThreshold = layer.filter === 'threshold';
                const isGrain = layer.filter === 'grain';
                const isStochastic = layer.filter === 'stochastic';
                
                // SVG Icons
                const eyeIcon = layer.visible ? 
                    `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>` : 
                    `<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`;

                const layerHTML = `
                <div class="layer-card bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-3 shadow-sm transition-opacity" 
                     data-index="${index}"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event, ${index})"
                     ondragend="handleDragEnd(event)">
                    
                    <!-- Header -->
                    <div class="flex items-center justify-between mb-3 border-b border-gray-100 dark:border-gray-700 pb-2">
                        <div class="flex items-center gap-2 flex-1">
                            <div class="cursor-grab text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" 
                                 onmouseenter="this.closest('.layer-card').setAttribute('draggable', true)" 
                                 onmouseleave="this.closest('.layer-card').removeAttribute('draggable')"
                                 ondragstart="handleDragStart(event, ${index})"
                                 title="Drag to reorder">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 6a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM8 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM14 6a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM14 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM14 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM20 6a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM20 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM20 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg>
                            </div>
                            <button onclick="toggleLayerVisibility(${index})" class="text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white" title="Toggle Visibility">
                                ${eyeIcon}
                            </button>
                            <span class="text-sm font-medium focus:outline-none focus:border-b focus:border-blue-500 w-full truncate" contenteditable="true" onblur="updateLayerName(${index}, this.innerText)" onkeydown="if(event.key === 'Enter'){event.preventDefault(); this.blur();}">${layer.name}</span>
                        </div>

                    </div>

                    <!-- Settings -->
                    <div class="space-y-3">
                        <div class="flex gap-2">
                            <select onchange="updateLayer(${index}, 'filter', this.value)" class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-blue-500 text-gray-700 dark:text-gray-200 outline-none">

                                <option value="threshold" ${layer.filter === 'threshold' ? 'selected' : ''}>Threshold</option>
                                <option value="grayscale" ${layer.filter === 'grayscale' ? 'selected' : ''}>Grayscale</option>

                            <select onchange="updateLayer(${index}, 'blendMode', this.value)" class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-blue-500 text-gray-700 dark:text-gray-200 outline-none" title="Blend Mode">

                                <option value="lighten" ${layer.blendMode === 'lighten' ? 'selected' : ''}>Lighten</option>
                            </select>
                        </div>

                        <!-- Filter Specific Controls -->
                        ${isGeometric ? `
                        <div class="space-y-2 bg-gray-50 dark:bg-gray-900/50 p-2 rounded">
                            <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">

                        ${isStochastic ? `

                            <select onchange="updateLayer(${index}, 'stochasticPreset', this.value)" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded px-2 py-1 text-xs text-gray-700 dark:text-gray-200 outline-none">
                                <option value="turing" ${layer.stochasticPreset === 'turing' ? 'selected' : ''}>Turing (Classic)</option>
                                <option value="worms" ${layer.stochasticPreset === 'worms' ? 'selected' : ''}>Worms (Sinuous)</option>
                                <option value="chaos" ${layer.stochasticPreset === 'chaos' ? 'selected' : ''}>Chaos (Rough)</option>

                            <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 mt-2">

                            <input type="range" min="1" max="15" value="${layer.size}"

                        ${isGrain || isThreshold ? `

                        <!-- Opacity -->
                        <div class="flex items-center gap-2 pt-1 border-t border-gray-100 dark:border-gray-700/50">
                            <span class="text-xs text-gray-400 dark:text-gray-500 w-12">Opacity</span>
                            <input type="range" min="0" max="100" value="${layer.opacity}" 
                                oninput="document.getElementById('val_op_${index}').innerText = this.value + '%'"
                                onchange="updateLayer(${index}, 'opacity', parseInt(this.value))" class="flex-1 accent-gray-500 h-1">

                layersContainer.insertAdjacentHTML('beforeend', layerHTML);
            });
        }

        // --- Data Binding Actions ---
        function updateLayer(index, key, value) {
            layers[index][key] = value;
            
            // Re-render UI only if filter type changed to swap controls
            if (key === 'filter' || key === 'stochasticPreset') {
                // Adjust defaults based on filter choice
                if (key === 'filter') {
                    if (value === 'threshold') layers[index].size = 128;
                    else if (value === 'grain') layers[index].size = 15;
                    else if (['halftone', 'line', 'crosshatch', 'sine'].includes(value)) layers[index].size = 6;
                }
                renderLayersUI();
            }
            processImage();
        }

        function updateLayerName(index, name) {
            layers[index].name = name;
        }

        function toggleLayerVisibility(index) {
            layers[index].visible = !layers[index].visible;
            renderLayersUI();
            processImage();
        }

        function deleteLayer(index) {
            layers.splice(index, 1);
            renderLayersUI();
            processImage();
        }

        // --- Core Image Processing ---
        function handleUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    canvasWrapper.classList.remove('hidden');
                    uploadPrompt.classList.add('hidden');
                    
                    centerCanvas();
                    processImage();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Processing Pipeline
        function processImage() {
            if (!originalImage || isProcessing) return;
            isProcessing = true;

            // Start with a clean slate
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background Layer if visible
            if (bgLayer.visible) {
                ctx.fillStyle = bgLayer.color;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Original Image (This acts as the base if layers modify it, though layers often act fully on their own)
            // To maintain a non-destructive workflow, we process layers on temp canvases and composite them.
            
            // If there are no visible layers, just draw the image
            const visibleLayers = layers.filter(l => l.visible);
            if (visibleLayers.length === 0) {
                ctx.drawImage(originalImage, 0, 0);
                isProcessing = false;
                return;
            }

            // Create an offscreen canvas to process the original image data for filters
            const offscreen = document.createElement('canvas');
            offscreen.width = canvas.width;
            offscreen.height = canvas.height;
            const offCtx = offscreen.getContext('2d', { willReadFrequently: true });
            
            // Reversing loop to draw bottom-up (layers[0] is visually top)
            for (let i = visibleLayers.length - 1; i >= 0; i--) {
                const layer = visibleLayers[i];
                
                // Draw clean image to offscreen
                offCtx.clearRect(0, 0, canvas.width, canvas.height);
                offCtx.drawImage(originalImage, 0, 0);
                
                // Apply Filter to offscreen
                applyFilter(offCtx, layer);

                // Composite onto main canvas
                ctx.globalAlpha = layer.opacity / 100;
                ctx.globalCompositeOperation = layer.blendMode;
                ctx.drawImage(offscreen, 0, 0);
            }

            // Reset composite operation
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';
            
            isProcessing = false;
        }

        // --- Filter Algorithms ---
        function applyFilter(targetCtx, layer) {
            const w = canvas.width;
            const h = canvas.height;
            const imgData = targetCtx.getImageData(0, 0, w, h);
            const data = imgData.data;

            if (layer.filter === 'grayscale') {
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i+3] === 0) continue;
                    const avg = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                    data[i] = data[i+1] = data[i+2] = avg;
                }
                targetCtx.putImageData(imgData, 0, 0);
            } 
            else if (layer.filter === 'threshold') {
                const thresh = layer.size || 128;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i+3] === 0) continue;
                    const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                    const val = lum >= thresh ? 255 : 0;
                    if (val === 255) {
                        data[i+3] = 0; // make white transparent
                    } else {
                        data[i] = data[i+1] = data[i+2] = 0; // black
                        data[i+3] = 255;
                    }
                }
                targetCtx.putImageData(imgData, 0, 0);
            }
            else if (layer.filter === 'dithering') {
                // Floyd-Steinberg
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = (y * w + x) * 4;
                        if (data[idx+3] === 0) continue;
                        
                        const oldR = data[idx];
                        const oldG = data[idx+1];
                        const oldB = data[idx+2];
                        const lum = 0.299 * oldR + 0.587 * oldG + 0.114 * oldB;
                        
                        const newLum = lum < 128 ? 0 : 255;
                        const err = lum - newLum;
                        
                        if (newLum === 255) {
                            data[idx+3] = 0; // Transparent instead of white
                        } else {
                            data[idx] = data[idx+1] = data[idx+2] = 0; // Black
                            data[idx+3] = 255;
                        }

                        // Distribute error
                        const distribute = (ex, ey, factor) => {
                            if (ex >= 0 && ex < w && ey >= 0 && ey < h) {
                                const eIdx = (ey * w + ex) * 4;
                                if (data[eIdx+3] > 0) {
                                    // Add error to RGB roughly
                                    data[eIdx] = Math.min(255, Math.max(0, data[eIdx] + err * factor));
                                    data[eIdx+1] = Math.min(255, Math.max(0, data[eIdx+1] + err * factor));
                                    data[eIdx+2] = Math.min(255, Math.max(0, data[eIdx+2] + err * factor));
                                }
                            }
                        };
                        distribute(x + 1, y, 7/16);
                        distribute(x - 1, y + 1, 3/16);
                        distribute(x, y + 1, 5/16);
                        distribute(x + 1, y + 1, 1/16);
                    }
                }
                targetCtx.putImageData(imgData, 0, 0);
            }
            else if (layer.filter === 'grain') {
                const intensity = layer.size / 30; // 1 to 30 mapped to probability
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i+3] === 0) continue;
                    
                    const lum = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]) / 255;
                    // Lower luminance = higher probability of drawing a pixel
                    const prob = (1 - lum) * intensity;
                    
                    if (Math.random() < prob) {
                        data[i] = data[i+1] = data[i+2] = 0;
                        data[i+3] = 255;
                    } else {
                        data[i+3] = 0;
                    }
                }
                targetCtx.putImageData(imgData, 0, 0);
            }
            else if (layer.filter === 'stochastic') {
                // Pseudo-Reaction-Diffusion algorithm via morphological noise processing
                const outData = new Uint8ClampedArray(w * h * 4);
                
                // Configuration based on preset
                let noiseDensity = 0.5;
                let blurRadius = layer.size || 5; 
                let contrastThreshold = 128;

                if (layer.stochasticPreset === 'worms') {
                    noiseDensity = 0.3;
                    blurRadius = (layer.size || 5) * 1.5;
                } else if (layer.stochasticPreset === 'chaos') {
                    noiseDensity = 0.7;
                    blurRadius = (layer.size || 5) * 0.5;
                }

                // 1. Generate Noise map based on image luminance
                const noiseMap = new Float32Array(w * h);
                for (let i = 0; i < w * h; i++) {
                    const idx = i * 4;
                    if (data[idx+3] === 0) continue;
                    
                    const lum = (0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]) / 255;
                    // Seed noise biased by luminance
                    noiseMap[i] = Math.random() < (noiseDensity * (1-lum)) ? 1 : 0;
                }

                // 2. Fast Box Blur on Noise map to create structure (simulating diffusion)
                const blurredMap = new Float32Array(w * h);
                const r = Math.max(1, Math.floor(blurRadius));
                
                // Horizontal pass
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        let sum = 0;
                        let count = 0;
                        for (let k = -r; k <= r; k++) {
                            const nx = x + k;
                            if (nx >= 0 && nx < w) {
                                sum += noiseMap[y * w + nx];
                                count++;
                            }
                        }
                        blurredMap[y * w + x] = sum / count;
                    }
                }
                
                // Vertical pass & thresholding
                for (let x = 0; x < w; x++) {
                    for (let y = 0; y < h; y++) {
                        let sum = 0;
                        let count = 0;
                        for (let k = -r; k <= r; k++) {
                            const ny = y + k;
                            if (ny >= 0 && ny < h) {
                                sum += blurredMap[ny * w + x]; // use horiz result
                                count++;
                            }
                        }
                        const finalVal = sum / count;
                        
                        const idx = (y * w + x) * 4;
                        if (data[idx+3] > 0) {
                            // Thresholding creates the sharp organic boundaries
                            const lum = (0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]) / 255;
                            // Dynamic threshold based on original image brightness
                            const thresh = 0.5 + (lum - 0.5) * 0.8; 
                            
                            if (finalVal > thresh) {
                                outData[idx] = outData[idx+1] = outData[idx+2] = 0;
                                outData[idx+3] = 255;
                            } else {
                                outData[idx+3] = 0;
                            }
                        }
                    }
                }
                
                imgData.data.set(outData);
                targetCtx.putImageData(imgData, 0, 0);
            }
            else if (['halftone', 'line', 'crosshatch', 'sine'].includes(layer.filter)) {
                // Geometric engines
                targetCtx.clearRect(0, 0, w, h);
                targetCtx.fillStyle = 'black';
                targetCtx.strokeStyle = 'black';
                
                const s = layer.size || 6;
                const angleRad = (layer.angle * Math.PI) / 180;
                const cos = Math.cos(angleRad);
                const sin = Math.sin(angleRad);

                // Determine bounds to cover rotated image
                const diag = Math.sqrt(w*w + h*h);
                const halfDiag = diag / 2;
                const cx = w / 2;
                const cy = h / 2;
                
                targetCtx.beginPath();
                
                for (let x = -halfDiag; x < halfDiag; x += s) {
                    for (let y = -halfDiag; y < halfDiag; y += s) {
                        
                        // Rotate grid point back to image space
                        const sx = Math.floor(cx + x * cos - y * sin);
                        const sy = Math.floor(cy + x * sin + y * cos);
                        
                        if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
                            const idx = (sy * w + sx) * 4;
                            if (data[idx+3] === 0) continue; // skip transparent
                            
                            const lum = (0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]) / 255;
                            const amt = 1 - lum; // darkness determines size/thickness
                            
                            if (amt > 0.05) {
                                const dx = sx;
                                const dy = sy;
                                const len = (s/2) * amt;
                                
                                if (layer.filter === 'halftone') {
                                    const r = (s * amt) / 2;
                                    targetCtx.moveTo(dx + r, dy);
                                    targetCtx.arc(dx, dy, r, 0, Math.PI * 2);
                                } 
                                else if (layer.filter === 'line') {
                                    const lx1 = dx - len * cos;
                                    const ly1 = dy - len * sin;
                                    const lx2 = dx + len * cos;
                                    const ly2 = dy + len * sin;
                                    targetCtx.moveTo(lx1, ly1);
                                    targetCtx.lineTo(lx2, ly2);
                                }
                                else if (layer.filter === 'crosshatch') {
                                    // Line 1
                                    const lx1 = dx - len * cos;
                                    const ly1 = dy - len * sin;
                                    const lx2 = dx + len * cos;
                                    const ly2 = dy + len * sin;
                                    targetCtx.moveTo(lx1, ly1);
                                    targetCtx.lineTo(lx2, ly2);
                                    // Line 2 (Perpendicular)
                                    const pCos = Math.cos(angleRad + Math.PI/2);
                                    const pSin = Math.sin(angleRad + Math.PI/2);
                                    const px1 = dx - len * pCos;
                                    const py1 = dy - len * pSin;
                                    const px2 = dx + len * pCos;
                                    const py2 = dy + len * pSin;
                                    targetCtx.moveTo(px1, py1);
                                    targetCtx.lineTo(px2, py2);
                                }
                                else if (layer.filter === 'sine') {
                                    const steps = 6;
                                    const totalLen = s * amt;
                                    for (let i = 0; i <= steps; i++) {
                                        const t = i / steps; 
                                        const segX = -totalLen/2 + t * totalLen;
                                        // Sine wave amplitude
                                        const wave = Math.sin(t * Math.PI * 2) * (s/4) * amt; 
                                        
                                        const finalX = dx + segX * cos - wave * Math.sin(angleRad + Math.PI/2);
                                        const finalY = dy + segX * sin + wave * Math.cos(angleRad + Math.PI/2);
                                        
                                        if (i === 0) targetCtx.moveTo(finalX, finalY);
                                        else targetCtx.lineTo(finalX, finalY);
                                    }
                                }
                            }
                        }
                    }
                }
                
                if (layer.filter === 'halftone') {
                    targetCtx.fill();
                } else {
                    targetCtx.lineWidth = layer.filter === 'sine' ? s * 0.3 : s * 0.4;
                    targetCtx.lineCap = 'round';
                    targetCtx.stroke();
                }
            }
        }

        // --- Remove Background (Edge Flood Fill) ---
        function removeBackground() {
            if (!originalImage) return;
            
            // Setup a fresh canvas to modify the original image state
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(originalImage, 0, 0);
            
            const imgData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const w = canvas.width;
            const h = canvas.height;
            
            const visited = new Uint8Array(w * h);
            const queue = [];
            const tolerance = 30; // Tolerance level

            function getColor(x, y) {
                const i = (y * w + x) * 4;
                return [data[i], data[i+1], data[i+2], data[i+3]];
            }
            
            function colorDist(c1, c2) {
                return Math.sqrt((c1[0]-c2[0])**2 + (c1[1]-c2[1])**2 + (c1[2]-c2[2])**2);
            }

            // Seed queue with all edge pixels
            const seedColors = [];
            for (let x = 0; x < w; x++) {
                queue.push(x); // top edge
                visited[x] = 1;
                seedColors.push(getColor(x, 0));
                
                queue.push((h-1) * w + x); // bottom edge
                visited[(h-1) * w + x] = 1;
                seedColors.push(getColor(x, h-1));
            }
            for (let y = 0; y < h; y++) {
                queue.push(y * w); // left edge
                visited[y * w] = 1;
                seedColors.push(getColor(0, y));
                
                queue.push(y * w + (w-1)); // right edge
                visited[y * w + (w-1)] = 1;
                seedColors.push(getColor(w-1, y));
            }

            // Calculate average outer color to use as target
            let r=0, g=0, b=0, validCount=0;
            seedColors.forEach(c => {
                if(c[3] > 0) { r+=c[0]; g+=c[1]; b+=c[2]; validCount++; }
            });
            if(validCount === 0) return; // already empty
            const targetColor = [r/validCount, g/validCount, b/validCount, 255];

            // BFS Flood Fill
            let head = 0;
            while (head < queue.length) {
                const idx = queue[head++];
                const x = idx % w;
                const y = Math.floor(idx / w);
                
                const cIdx = idx * 4;
                const currentColor = [data[cIdx], data[cIdx+1], data[cIdx+2], data[cIdx+3]];
                
                if (currentColor[3] === 0 || colorDist(currentColor, targetColor) > tolerance) {
                    continue; // Stop filling at edges
                }
                
                // Clear pixel
                data[cIdx+3] = 0; 
                
                // Add neighbors
                const neighbors = [
                    [x+1, y], [x-1, y], [x, y+1], [x, y-1]
                ];
                
                for (let [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const nIdx = ny * w + nx;
                        if (!visited[nIdx]) {
                            visited[nIdx] = 1;
                            queue.push(nIdx);
                        }
                    }
                }
            }

            tempCtx.putImageData(imgData, 0, 0);
            
            // Replace original image with transparency-applied version
            const newImg = new Image();
            newImg.onload = () => {
                originalImage = newImg;
                processImage();
            };
            newImg.src = tempCanvas.toDataURL();
        }

        // --- Toast Management ---
        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('coffeeToast');
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(hideToast, 10000); // Auto-hide after 10 seconds
        }

        function hideToast() {
            const toast = document.getElementById('coffeeToast');
            toast.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
            toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
        }

        // --- Export ---
        function exportImage() {
            if (!originalImage) return;
            // The canvas already holds the final composited image accurately.
            // If bgLayer is off, the background is transparent.
            const dataUrl = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'stochastic-export.png';
            link.href = dataUrl;
            link.click();
            
            // Show support toast
            setTimeout(showToast, 500);
        }

        // Boot
        window.onload = init;
    </script>
</body>
</html>
